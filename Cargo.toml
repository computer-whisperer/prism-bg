[package]
name = "prism-bg"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Color-managed wallpaper client for Wayland — swaybg, in Rust, HDR-aware"
repository = "https://github.com/computer-whisperer/prism-bg"
authors = ["Christian Balcom"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2.6", features = ["bytemuck"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# wayland client stack. Color management is hand-wired from the staging
# bindings; SCTK covers registry/output/shm/layer-shell boilerplate.
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }

# image decoding. `png` is used directly (cICP/iCCP/gAMA/cHRM access);
# jxl-oxide likewise for its native color encoding metadata. The `image`
# crate covers JPEG/WebP/AVIF/EXR/Radiance-HDR, with ICC via ImageDecoder.
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "exr", "hdr", "avif-native"] }
jxl-oxide = "0.12"

# pure-Rust CMS for ICC profile handling (prism takes parametric
# descriptions only, so ICC is resolved client-side).
moxcms = "0.8"

# playlist shuffle (--image-list --randomize).
fastrand = "2"

# GPU shader wallpapers (--shader). ash is thin Vulkan bindings: we drive
# the dmabuf-export + drm-format-modifier path directly (no WSI swapchain),
# so the client keeps control of the buffer and its color-management tag,
# exactly as the shm path does. shaderc links system libshaderc for
# GLSL→SPIR-V at load time; drm-fourcc names the DRM formats/modifiers
# shared with the compositor.
ash = "0.38"
shaderc = "0.10"
drm-fourcc = "2"
# DRM device-node (dev_t) math for matching a Vulkan device to the GPU a
# given output is on (VK_EXT_physical_device_drm ↔ dmabuf-feedback target),
# and mmap of the dmabuf-feedback format table.
libc = "0.2"

# JPEG XR (Windows HDR wallpapers/screenshots, scRGB) — vendored jxrlib C.
jpegxr = "0.3"

# jpegxr 0.3.1 vendored: its pinned bindgen 0.69 generates opaque structs
# with current libclang (forward-declared tagPKImageDecode); bumped to
# bindgen 0.72. Drop the patch when upstream updates.
[patch.crates-io]
jpegxr = { path = "vendor/jpegxr" }
