name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# The jpegxr crate is vendored in-repo (vendor/jpegxr, wired via
# [patch.crates-io]), so a plain checkout builds. Cargo.lock is committed;
# all cargo invocations use --locked to fail on lockfile drift.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # libdav1d for AVIF decode (image/avif-native -> dav1d-sys via
      # pkg-config); clang for the vendored jpegxr's bindgen build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev clang pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev clang pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked
